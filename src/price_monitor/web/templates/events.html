{% extends 'base.html' %}{% block content %}<h1>Події</h1><p class="muted">Зміни цін, наявності та складу каталогів. Нові записи — першими.</p>
<form class="filters" action="/events" hx-get="/events" hx-target="#results" hx-push-url="true" hx-trigger="submit, change"><label>Магазин<select name="source"><option value="">Усі магазини</option>{% for s in sources %}<option value="{{ s.id }}" {% if selected_source == s.id %}selected{% endif %}>{{ s.title }}</option>{% endfor %}</select></label><label>Тип події<select name="kind"><option value="">Усі події</option>{% for code, label in event_labels.items() %}<option value="{{ code }}" {% if kind == code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button>Застосувати</button></form>
<div id="results" aria-live="polite">{% include 'partials/events.html' %}</div>{% endblock %}
