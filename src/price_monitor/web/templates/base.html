<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <title>{% block title %}Price Monitor{% endblock %} · Price Monitor</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block head %}{% endblock %}
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Price Monitor</a>
    {% if active is defined %}
    <nav aria-label="Розділи">
      <a href="/" {% if active == 'sources' %}aria-current="page"{% endif %}>Джерела</a>
      <a href="/products" {% if active == 'products' %}aria-current="page"{% endif %}>Товари</a>
      <a href="/events" {% if active == 'events' %}aria-current="page"{% endif %}>Події</a>
      <a href="/report" {% if active == 'report' %}aria-current="page"{% endif %}>Звіт</a>
      <a href="/status" {% if active == 'status' %}aria-current="page"{% endif %}>Стан</a>
    </nav>
    <form method="post" action="/logout" class="logout"><button type="submit" class="link">Вийти</button></form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">Лише перегляд: дашборд читає базу монітора й нічого в ній не змінює. Час — UTC.</footer>
</body>
</html>
