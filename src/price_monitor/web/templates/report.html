{% extends 'base.html' %}{% block content %}<h1>XLSX-звіт</h1><section class="panel"><h2>Завантажити дані</h2><p class="muted">Current — останнє спостереження кожного товару, включно з видаленими. History — події за вибраний період. До 50 000 рядків сумарно.</p>
<form class="filters" method="get" action="/report/download"><label>Магазин<select name="source" required>{% for s in sources %}<option value="{{ s.id }}">{{ s.title }}</option>{% endfor %}</select></label><label>Від (UTC, включно)<input type="date" name="since" value="{{ since }}" required></label><label>До (UTC, не включно)<input type="date" name="until" value="{{ until }}" required></label><button {% if not sources %}disabled{% endif %}>Завантажити XLSX ↓</button></form><p class="muted">Період обмежує лише History; Current показує останні відомі дані.</p></section>{% endblock %}
