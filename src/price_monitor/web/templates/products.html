{% extends 'base.html' %}{% block content %}<a href="/" class="muted">← Магазини</a><h1>{{ source.title }}</h1><p><span class="badge {{ source.state }}">{{ states[source.state] }}</span> <span class="muted">Останній успішний збір: {{ source.last_success or 'ще не було' }} (UTC)</span></p>
{% if source.error %}<p class="notice error">{{ source.error }}</p>{% endif %}
<form class="filters" action="/sources/{{ source.id|segment }}" method="get" hx-get="/sources/{{ source.id|segment }}" hx-target="#results" hx-push-url="true" hx-trigger="submit, change delay:250ms, keyup changed delay:350ms from:input"><label>Назва або код<input name="q" value="{{ q }}" maxlength="200" placeholder="Наприклад, 00123"></label><label>Наявність<select name="availability"><option value="">Усі товари</option>{% for code, label in stocks.items() %}<option value="{{ code }}" {% if availability == code %}selected{% endif %}>{{ label }} ({{ code }})</option>{% endfor %}</select></label><button>Знайти</button></form>
<div id="results" aria-live="polite">{% include 'partials/products.html' %}</div>{% endblock %}
