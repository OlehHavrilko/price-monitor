# Demo catalog, monitor and a read-only web dashboard. The database lives in the
# named volume "data" and survives `docker compose down` and container restarts.
services:
  demo:
    build: .
    command: ["price-monitor", "demo-serve", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - demo-state:/demo-state
    ports:
      - "127.0.0.1:8080:8080" # catalog is read-only over HTTP; scenarios change only via the CLI below
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/catalog?page=1')"]
      interval: 5s
      timeout: 3s
      retries: 10

  monitor:
    build: .
    depends_on:
      demo:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PRICE_MONITOR_DEMO_URL: http://demo:8080
      PRICE_MONITOR_INTERVAL_SECONDS: ${PRICE_MONITOR_INTERVAL_SECONDS:-60}
    volumes:
      - data:/data
      - demo-state:/demo-state # lets `demo-play` switch the demo catalog scenarios
    restart: unless-stopped

  web:
    build: .
    command: ["price-monitor", "web", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      monitor:
        condition: service_started
    environment:
      PRICE_MONITOR_WEB_TOKEN: ${PRICE_MONITOR_WEB_TOKEN:?Set PRICE_MONITOR_WEB_TOKEN in .env}
      PRICE_MONITOR_ENABLE_BOOKS: ${PRICE_MONITOR_ENABLE_BOOKS:-0}
      PRICE_MONITOR_ENABLE_ALLO: ${PRICE_MONITOR_ENABLE_ALLO:-0}
      PRICE_MONITOR_ENABLE_XCOM: ${PRICE_MONITOR_ENABLE_XCOM:-0}
    volumes:
      - data:/data:ro
    ports:
      - "127.0.0.1:${PRICE_MONITOR_WEB_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  data:
  demo-state:
